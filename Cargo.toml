[workspace]
members = ["ext/imprimatur_native/cli", "ext/imprimatur_native/core", "ext/imprimatur_native/ffi"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
authors = ["Abdelkader Boudih <oss@seuros.com>"]
license = "BSD-3-Clause"
repository = "https://github.com/seuros/imprimatur"

[workspace.dependencies]
imprimatur = { path = "ext/imprimatur_native/core", version = "0.1.0" }
magnus = { version = "0.9.2", default-features = false }
# For rb_thread_call_without_gvl2, which magnus does not wrap; magnus's own
# rb-sys, features and all.
rb-sys = { version = "0.9.130", default-features = false, features = ["stable-api"] }
regex = "1.13.1"
serde_json = "1.0.154"
tempfile = "3"
usage-parser = { package = "usage-lib", version = "7.0.1" }
usage-rs = "7.0.1"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
expect_used = "deny"
needless_borrow = "deny"
redundant_clone = "deny"
redundant_closure = "deny"
redundant_closure_for_method_calls = "deny"
trivially_copy_pass_by_ref = "deny"
uninlined_format_args = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = true
strip = true
