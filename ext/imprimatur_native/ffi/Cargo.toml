[package]
name = "imprimatur_native"
version = "0.7.0"
description = "Ruby bindings for the imprimatur crate"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
# Gems ship precompiled, so they carry every feature of the crate.
imprimatur = { workspace = true, features = ["archive", "fonts", "json", "isolation"] }
serde_json.workspace = true
magnus.workspace = true
rb-sys.workspace = true
