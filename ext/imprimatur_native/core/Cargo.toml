[package]
name = "imprimatur"
version = "0.8.0"
description = "XLSX, PDF and DOCX authoring, and PDF, XLSX, XLS, ODS and DOCX reading, with its own XML, zip and PDF code."
keywords = ["xlsx", "excel", "pdf", "docx", "spreadsheet"]
categories = ["encoding", "text-processing"]
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
include = [
  "src/**/*.rs",
  "src/**/*.txt",
  "README.md",
  "LICENSE*",
  # Tests and their fixtures build nothing a published crate needs.
  "!src/**/tests.rs",
  "!src/**/tests/**",
  "!src/**/test_support.rs",
]

[lints]
workspace = true

[dependencies]
aes.workspace = true
crc32fast.workspace = true
datamatrix.workspace = true
hayro = { workspace = true, optional = true }
md-5.workspace = true
miniz_oxide.workspace = true
qrcode.workspace = true
read-fonts = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2.workspace = true
thiserror.workspace = true
tempfile = { workspace = true, optional = true }
zip = { workspace = true, optional = true }

[features]
# `read::json`: content and images as JSON, the schema the command line and
# the Ruby binding share.
json = ["dep:serde_json"]
# `archive`: zip archives of any files (written with their times and
# comments, ZIP64 when large; read within limits), through the `zip` crate.
archive = ["dep:zip"]
# `font`: static TrueType font data (glyphs, advances, line metrics),
# through `read-fonts`.
fonts = ["dep:read-fonts"]
# Pure-Rust full-page PDF rasterization; readers and writers remain independent.
render = ["dep:hayro"]
isolation = ["render", "json", "dep:serde", "dep:tempfile", "dep:nix", "dep:libproc"]

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
libproc = { workspace = true, optional = true }

[[bin]]
name = "imprimatur-render-worker"
path = "src/bin/imprimatur-render-worker.rs"
required-features = ["isolation"]

[dev-dependencies]
font-test-data.workspace = true
tempfile.workspace = true
zip.workspace = true
